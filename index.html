<!doctype html>
<html lang="fr" data-theme="plateau">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Le jardin du Chef Op</title>
  <meta name="description" content="Outil pour chefs opérateurs : traduire les intentions du réalisateur en cadrages, mouvements et lumières, avec consignes par poste.">
  <meta name="theme-color" content="#0d0e10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chef Op">
  <link rel="preload" href="fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { var t = JSON.parse(localStorage.getItem('jco.theme')); if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'jardin' : 'plateau'; document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <noscript><p style="padding:20px">Le jardin du Chef Op nécessite JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
